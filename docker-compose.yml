services:
  ubuntu-dev:
    build: .
    container_name: ubuntu-dev
    tty: true
    depends_on:
      - postgres
    env_file:
      - ./init/.env
    environment:
      - TZ=America/New_York
    networks:
      - app-network
    secrets:
      - db_user
      - db_password
    volumes:
      - ./app:/app
  postgres:
    image: postgres:18.4@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
  
  pgadmin:
    image: dpage/pgadmin4:9.16@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    
  # https://hub.docker.com/layers/gvenzl/oracle-xe/21/images/sha256-c2682a4216b0fe65537912c4a049c7e5c15a85bb7c94bb8137d5f2d2eef60603
  oracle-db:
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/${ORACLE_PASSWORD}@localhost:1521/XEPDB1"]
      interval: 20s
      timeout: 10s
      retries: 10
    image: gvenzl/oracle-xe:21-slim@sha256:c2682a4216b0fe65537912c4a049c7e5c15a85bb7c94bb8137d5f2d2eef60603
    networks:
      - app-network
    ports:
      - "${ORACLE_PORT}:1521"
    restart: unless-stopped
    volumes:
      - oracle-data:/opt/oracle/oradata

  web:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./app/html:/usr/share/nginx/html

volumes:
  oracle-data:
  pgdata:
  pgadmin_data:

networks:
  app-network:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt